<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">Zarraf Alam Fahmid — Computer Engineering</title>
<desc id="desc">Animated engineering profile banner with a sensor-guided RC car, six infrared sensor indicators, a traffic light, and glowing printed-circuit traces.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07131c"/><stop offset=".55" stop-color="#0d2028"/><stop offset="1" stop-color="#142a2d"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a7f06b"/><stop offset="1" stop-color="#37d6bd"/></linearGradient>
  <linearGradient id="car" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4a64b"/><stop offset="1" stop-color="#ef6846"/></linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#9ad9c2" stroke-opacity=".07" stroke-width="1"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="390" rx="24" fill="url(#bg)"/>
<rect width="1200" height="390" rx="24" fill="url(#grid)"/>
<path d="M32 32H1168V358H32Z" fill="none" stroke="#8fd6b5" stroke-opacity=".18"/>
<g fill="none" stroke="#53c9ad" stroke-opacity=".25" stroke-width="2">
  <path d="M18 87h72v34h48"/><circle cx="138" cy="121" r="4" fill="#53c9ad"/>
  <path d="M1178 87h-70v48h-52"/><circle cx="1056" cy="135" r="4" fill="#53c9ad"/>
  <path d="M18 319h94v-34h45"/><circle cx="157" cy="285" r="4" fill="#53c9ad"/>
  <path d="M1180 318h-82v-31h-46"/><circle cx="1052" cy="287" r="4" fill="#53c9ad"/>
</g>
<g font-family="Arial,Helvetica,sans-serif">
  <text x="68" y="70" fill="#a7f06b" font-size="13" font-weight="700" letter-spacing="3">KETTERING UNIVERSITY  /  COMPUTER ENGINEERING</text>
  <text x="66" y="139" fill="#f2f6ef" font-size="51" font-weight="800" letter-spacing="1">ZARRAF ALAM</text>
  <text x="68" y="190" fill="#f2f6ef" font-size="51" font-weight="800" letter-spacing="1">FAHMID</text>
  <text x="70" y="226" fill="#c1d4ce" font-size="19">Embedded systems, PCB design &amp; automotive electronics</text>
  <g font-size="12" font-weight="700" letter-spacing="1.2">
    <rect x="68" y="254" width="157" height="31" rx="15" fill="#14342f" stroke="#3d927a"/><text x="84" y="274" fill="#b7f27c">HARDWARE + FIRMWARE</text>
    <rect x="235" y="254" width="116" height="31" rx="15" fill="#14342f" stroke="#3d927a"/><text x="252" y="274" fill="#b7f27c">VEHICLE CONTROL</text>
    <rect x="361" y="254" width="122" height="31" rx="15" fill="#14342f" stroke="#3d927a"/><text x="379" y="274" fill="#b7f27c">PCB DESIGN</text>
  </g>
  <text x="70" y="326" fill="#799d95" font-size="12" letter-spacing="2">DESIGN  →  INTEGRATE  →  TEST  →  REFINE</text>
</g>
<!-- PCB-style track -->
<g fill="none" stroke="#4bc5a5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".67">
  <path d="M590 78h85v32h42"/><path d="M1156 94h-60v29h-39"/>
  <path d="M580 320h86v-31h48"/><path d="M1158 310h-64v-38h-37"/>
  <path d="M660 194h51"/><path d="M990 194h74v-40h30"/>
</g>
<g fill="#07131c" stroke="#6be3c2" stroke-width="2"><circle cx="717" cy="110" r="5"/><circle cx="1057" cy="123" r="5"/><circle cx="714" cy="289" r="5"/><circle cx="1057" cy="272" r="5"/></g>
<!-- lane -->
<path d="M724 111 C830 111 817 145 817 194 C817 248 873 278 1021 278" fill="none" stroke="#315159" stroke-width="65" stroke-linecap="round"/>
<path d="M724 111 C830 111 817 145 817 194 C817 248 873 278 1021 278" fill="none" stroke="#c1d4ce" stroke-opacity=".62" stroke-width="2" stroke-dasharray="12 14">
  <animate attributeName="stroke-dashoffset" values="0;-52" dur="3s" repeatCount="indefinite"/>
</path>
<!-- lane sensor markers -->
<g fill="#a7f06b" filter="url(#glow)">
  <circle cx="780" cy="119" r="5"><animate attributeName="opacity" values=".35;1;.35" dur="1.5s" repeatCount="indefinite"/></circle>
  <circle cx="801" cy="157" r="5"><animate attributeName="opacity" values="1;.35;1" dur="1.5s" repeatCount="indefinite"/></circle>
  <circle cx="817" cy="192" r="5"><animate attributeName="opacity" values=".35;1;.35" dur="1.5s" repeatCount="indefinite"/></circle>
  <circle cx="836" cy="235" r="5"><animate attributeName="opacity" values="1;.35;1" dur="1.5s" repeatCount="indefinite"/></circle>
  <circle cx="878" cy="266" r="5"><animate attributeName="opacity" values=".35;1;.35" dur="1.5s" repeatCount="indefinite"/></circle>
  <circle cx="921" cy="278" r="5"><animate attributeName="opacity" values="1;.35;1" dur="1.5s" repeatCount="indefinite"/></circle>
</g>
<!-- miniature RC car -->
<g transform="translate(0 0)">
  <animateTransform attributeName="transform" type="translate" values="0 0;34 0;0 0" dur="6s" repeatCount="indefinite"/>
  <g transform="translate(804 168) rotate(90)">
    <rect x="-9" y="-24" width="18" height="48" rx="7" fill="url(#car)" stroke="#ffe0bd" stroke-width="1.5"/>
    <path d="M-7 -7Q0 -17 7 -7V8H-7Z" fill="#1c3a42"/>
    <rect x="-13" y="-16" width="5" height="12" rx="2" fill="#10191c"/><rect x="8" y="-16" width="5" height="12" rx="2" fill="#10191c"/>
    <rect x="-13" y="7" width="5" height="12" rx="2" fill="#10191c"/><rect x="8" y="7" width="5" height="12" rx="2" fill="#10191c"/>
    <path d="M-5 -23h10" stroke="#fff4dc" stroke-width="2"/>
  </g>
</g>
<!-- traffic light -->
<g transform="translate(1030 130)">
  <rect x="0" y="0" width="44" height="92" rx="12" fill="#101a20" stroke="#8da49e" stroke-width="2"/>
  <circle cx="22" cy="22" r="10" fill="#f35e54"><animate attributeName="opacity" values="1;.28;1" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="22" cy="46" r="9" fill="#5d4939"/>
  <circle cx="22" cy="69" r="10" fill="#80df76"><animate attributeName="opacity" values=".35;1;.35" dur="3s" repeatCount="indefinite"/></circle>
  <path d="M22 92v30" stroke="#8da49e" stroke-width="4"/>
</g>
<g font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="1.4">
  <text x="737" y="83" fill="#9ee6cb">6× IR SENSOR ARRAY</text>
  <text x="1004" y="250" fill="#9ee6cb">PIXY2 / SIGNAL DETECTION</text>
  <text x="871" y="326" fill="#a7f06b">PID LINE FOLLOWING</text>
</g>
<circle cx="652" cy="194" r="4" fill="#a7f06b"><animate attributeName="r" values="3;6;3" dur="1.8s" repeatCount="indefinite"/></circle>
</svg>